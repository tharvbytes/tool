<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hash Generator</title>
<meta name="description" content="Generate MD5, SHA-1, SHA-256 and SHA-512 hashes of text or files in your browser, and verify a hash you already have.">
<meta name="robots" content="index,follow">
<meta name="theme-color" content="#fbf9ff">
<meta property="og:type" content="website">
<meta property="og:site_name" content="MicroService Tools">
<meta property="og:title" content="Hash Generator">
<meta property="og:description" content="Generate MD5, SHA-1, SHA-256 and SHA-512 hashes of text or files in your browser, and verify a hash you already have.">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="Hash Generator">
<meta name="twitter:description" content="Generate MD5, SHA-1, SHA-256 and SHA-512 hashes of text or files in your browser, and verify a hash you already have.">
<style>
:root{color-scheme:light;
  --primary:#600060;--primary-bg:#FFFAFA;--secondary-bg:#800080;--secondary-text:#FFFAFA;
  --soft:rgba(96,0,96,.68);--line:rgba(96,0,96,.2);--panel:rgba(96,0,96,.06);--err:#b00020}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--primary-bg);color:var(--primary);font:15px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden}
.wrap{height:100%;max-width:1180px;margin:0 auto;padding:22px 24px 12px;display:flex;flex-direction:column}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;padding-bottom:10px;border-bottom:2px solid var(--primary);margin-bottom:14px}
h1{font:400 clamp(1.9rem,4vw,2.7rem)/1 Charter,"Bitstream Charter","Iowan Old Style",Georgia,serif;margin:0;letter-spacing:-.02em}
.tag{color:var(--soft);font-size:.88rem;text-align:right;max-width:34ch}
.tabs{display:flex;flex-wrap:wrap;border:1px solid var(--primary);border-radius:8px;overflow:hidden;align-self:flex-start;margin-bottom:10px}
.tabs button{border:0;border-radius:0;padding:8px 20px;background:transparent;color:var(--primary);font-weight:600}
.tabs button+button{border-left:1px solid var(--primary)}
.tabs button[aria-pressed=true]{background:var(--secondary-bg);color:var(--secondary-text)}
.tabs button:hover:not([aria-pressed=true]){background:var(--panel);color:var(--primary)}
.opts{display:flex;flex-wrap:wrap;gap:8px 20px;align-items:center;margin-bottom:12px}
.opts .sp{flex:1}
.seg{display:flex;border:1px solid var(--primary);border-radius:6px;overflow:hidden}
.seg button{border:0;border-radius:0;padding:5px 16px;background:transparent;color:var(--primary)}
.seg button+button{border-left:1px solid var(--primary)}
.seg button[aria-pressed=true]{background:var(--secondary-bg);color:var(--secondary-text)}
select{padding:6px 10px;border:1px solid var(--primary);border-radius:6px;background:#fff;color:var(--primary);font:inherit}
button{font:inherit;cursor:pointer;border-radius:6px;padding:5px 14px;border:1px solid var(--primary);background:transparent;color:var(--primary)}
button:hover{background:var(--primary);color:var(--primary-bg)}
button.fill{background:var(--secondary-bg);border-color:var(--secondary-bg);color:var(--secondary-text);font-weight:600}
button.fill:hover{background:var(--primary);border-color:var(--primary)}
:focus-visible{outline:3px solid var(--secondary-bg);outline-offset:2px}
.grid{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;gap:20px}
.pane{display:flex;flex-direction:column;min-height:0}
.head{display:flex;align-items:center;gap:8px;min-height:32px;margin-bottom:6px}
.head b{font:400 1.15rem Charter,Georgia,serif;flex:1}
textarea{flex:1;min-height:0;width:100%;resize:none;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--primary);font:.9rem/1.55 ui-monospace,Menlo,Consolas,monospace}
textarea:focus{outline:2px solid var(--secondary-bg)}
.drop{flex:1;min-height:0;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;border:2px dashed var(--secondary-bg);border-radius:10px;background:var(--panel);cursor:pointer;text-align:center;padding:16px}
.drop.over{background:rgba(128,0,128,.18)}
.drop:focus-within{outline:3px solid var(--secondary-bg);outline-offset:2px}
.drop input{position:absolute;opacity:0;width:1px;height:1px}
.drop strong{font:400 1.25rem Charter,Georgia,serif}
.drop small{color:var(--soft);word-break:break-all}
.ver{margin-top:10px;padding:10px 12px;background:var(--panel);border-radius:10px}
.ver label{display:block;font-size:.84rem;font-weight:600;margin-bottom:4px}
.ver input{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--primary);font:.85rem ui-monospace,Menlo,Consolas,monospace}
.vm{min-height:1.3em;margin-top:5px;font-size:.88rem;font-weight:600}
.rows{flex:1;min-height:0;overflow-y:auto;border-top:1px solid var(--line)}
.row{padding:10px 2px;border-bottom:1px solid var(--line)}
.rh{display:flex;align-items:center;gap:10px;margin-bottom:4px}
.rh b{font:400 1.1rem Charter,Georgia,serif}
.rh small{color:var(--soft);flex:1}
.rh button{padding:2px 12px;font-size:.84rem}
.val{font:.9rem/1.5 ui-monospace,Menlo,Consolas,monospace;word-break:break-all;color:var(--primary)}
.val.ph{color:var(--soft);font-family:inherit}
.rows.single .val{font-size:1.1rem}
.info{margin:6px 0 0;min-height:1.3em;color:var(--soft);font-size:.84rem}
.err{color:var(--err);font-weight:600}
.foot{margin:6px 0 0;color:var(--soft);font-size:.76rem}
@media(max-width:860px){
  html,body{height:auto}body{overflow:auto}.wrap{height:auto}
  header{flex-direction:column;align-items:flex-start;gap:6px}.tag{text-align:left;max-width:none}
  .grid{grid-template-columns:1fr}textarea{min-height:180px}.drop{min-height:180px}.rows{max-height:none}
}
</style>
  <script defer src="Home.js"></script>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Hash Generator</h1>
    <div class="tag">MD5, SHA-1, SHA-256 and SHA-512 for text or files. Everything runs in your browser.</div>
  </header>

  <div class="tabs" id="tabs" role="group" aria-label="Algorithm">
    <button data-m="all" aria-pressed="true">General</button>
    <button data-m="md5" aria-pressed="false">MD5</button>
    <button data-m="sha1" aria-pressed="false">SHA-1</button>
    <button data-m="sha256" aria-pressed="false">SHA-256</button>
    <button data-m="sha512" aria-pressed="false">SHA-512</button>
  </div>

  <div class="opts">
    <div class="seg" id="src" role="group" aria-label="Input type"><button data-s="t" aria-pressed="true">Text</button><button data-s="f" aria-pressed="false">File</button></div>
    <label>Output <select id="fmt"><option value="hex">Hex, lowercase</option><option value="HEX">Hex, UPPERCASE</option><option value="b64">Base64</option></select></label>
    <span class="sp"></span>
    <button id="clear">Clear</button>
  </div>

  <div class="grid">
    <div class="pane">
      <div class="head"><b id="lIn">Text to hash</b></div>
      <textarea id="txt" spellcheck="false" placeholder="Type or paste text. Hashes update as you type."></textarea>
      <label class="drop" id="drop" hidden>
        <input type="file" id="file">
        <strong id="dn">Drop a file here</strong>
        <small id="ds">or click to choose one (up to 200 MB). The file is not uploaded.</small>
      </label>
      <div class="ver">
        <label for="vf">Check against a hash you already have</label>
        <input type="text" id="vf" placeholder="Paste an expected hash (hex or Base64)" spellcheck="false" autocomplete="off">
        <div class="vm" id="vm" aria-live="polite"></div>
      </div>
    </div>

    <div class="pane">
      <div class="head"><b>Hashes</b><button id="copyall" class="fill" aria-live="polite">Copy all</button></div>
      <div class="rows" id="rows"></div>
      <p class="info" id="info" aria-live="polite"></p>
    </div>
  </div>
  <p class="foot">Plain hashes are not a safe way to store passwords. Use bcrypt, scrypt or Argon2 for that. MD5 and SHA-1 are fine for checksums but are broken for security uses.</p>
</div>

<script>
const $=id=>document.getElementById(id);
const ALGS=[{id:'md5',name:'MD5',bits:128,legacy:1},{id:'sha1',name:'SHA-1',bits:160,legacy:1},{id:'sha256',name:'SHA-256',bits:256},{id:'sha512',name:'SHA-512',bits:512}];
const SUB={sha1:'SHA-1',sha256:'SHA-256',sha512:'SHA-512'};
const MAX=200*1048576;
let mode='all',src='t',file=null,R={},seq=0,fileSeq=0,note='';
const copyRequests=new WeakMap(),copyTimers=new WeakMap(),copyLabels=new WeakMap();

/* MD5 (not in Web Crypto) */
function md5(bytes){
  const K=new Int32Array(64),S=[7,12,17,22,5,9,14,20,4,11,16,23,6,10,15,21];
  for(let i=0;i<64;i++)K[i]=Math.floor(Math.abs(Math.sin(i+1))*4294967296)|0;
  const n=bytes.length,len=(((n+8)>>>6)+1)*64,buf=new Uint8Array(len);
  buf.set(bytes);buf[n]=0x80;
  const dv=new DataView(buf.buffer);
  dv.setUint32(len-8,(n<<3)>>>0,true);dv.setUint32(len-4,Math.floor(n/536870912),true);
  let a0=0x67452301,b0=0xefcdab89|0,c0=0x98badcfe|0,d0=0x10325476;
  const M=new Int32Array(16);
  for(let o=0;o<len;o+=64){
    for(let i=0;i<16;i++)M[i]=dv.getInt32(o+i*4,true);
    let A=a0,B=b0,C=c0,D=d0;
    for(let i=0;i<64;i++){
      let F,g;
      if(i<16){F=(B&C)|(~B&D);g=i}
      else if(i<32){F=(D&B)|(~D&C);g=(5*i+1)%16}
      else if(i<48){F=B^C^D;g=(3*i+5)%16}
      else{F=C^(B|~D);g=(7*i)%16}
      F=(F+A+K[i]+M[g])|0;
      A=D;D=C;C=B;
      const s=S[(i>>4)*4+(i&3)];
      B=(B+((F<<s)|(F>>>(32-s))))|0;
    }
    a0=(a0+A)|0;b0=(b0+B)|0;c0=(c0+C)|0;d0=(d0+D)|0;
  }
  const out=new Uint8Array(16),ov=new DataView(out.buffer);
  [a0,b0,c0,d0].forEach((v,i)=>ov.setInt32(i*4,v,true));
  return out;
}

const toHex=b=>[...b].map(x=>x.toString(16).padStart(2,'0')).join('');
const toB64=b=>{let s='';for(const x of b)s+=String.fromCharCode(x);return btoa(s)};
function fmt(b){const f=$('fmt').value;return f==='b64'?toB64(b):f==='HEX'?toHex(b).toUpperCase():toHex(b)}

async function run(){
  const id=++seq;let runNote='';
  note='';
  let bytes=null;
  if(src==='t'){const t=$('txt').value;bytes=t?new TextEncoder().encode(t):null}
  else bytes=file?file.bytes:null;
  if(!bytes){R={};draw();verify();return}
  const out={md5:md5(bytes)};
  if(window.crypto&&crypto.subtle){
    try{for(const a of Object.keys(SUB))out[a]=new Uint8Array(await crypto.subtle.digest(SUB[a],bytes))}
    catch(e){runNote='SHA hashing failed in this browser.'}
  }else runNote='SHA hashes need a secure page (https or localhost). MD5 is shown.';
  if(id!==seq)return;
  note=runNote;
  R=out;R._n=bytes.length;draw();verify();
}

function draw(){
  const rows=mode==='all'?ALGS:ALGS.filter(a=>a.id===mode);
  $('rows').className='rows'+(mode==='all'?'':' single');
  $('rows').innerHTML=rows.map(a=>{
    const h=R[a.id];
    return '<div class="row"><div class="rh"><b>'+a.name+'</b><small>'+a.bits+' bits'+(a.legacy?' \u00b7 legacy, not for security':'')+'</small>'+
      (h?'<button data-c="'+a.id+'" aria-live="polite">Copy</button>':'')+'</div><div class="val'+(h?'':' ph')+'">'+(h?fmt(h):'Nothing to hash yet.')+'</div></div>';
  }).join('');
  $('copyall').hidden=mode!=='all'||!R.md5;
  const i=$('info');
  i.className='info'+(note?' err':'');
  i.textContent=note||(R._n!=null?R._n.toLocaleString()+' byte'+(R._n===1?'':'s')+' hashed'+(src==='t'?' (UTF-8 text)':' from '+file.name):'');
}

function verify(){
  const raw=$('vf').value.trim(),m=$('vm');
  m.textContent='';
  if(!raw)return;
  if(!R.md5){m.textContent='Add some text or a file to compare against.';return}
  const s=raw.replace(/\s+/g,''),hex=s.toLowerCase().replace(/^0x/,''),b64=s.replace(/=+$/,'');
  const hits=ALGS.filter(a=>R[a.id]&&(toHex(R[a.id])===hex||toB64(R[a.id]).replace(/=+$/,'')===b64)).map(a=>a.name);
  m.textContent=hits.length?'\u2713 Match: '+hits.join(', '):'\u2717 No match. Check for a missing character or the wrong algorithm.';
}

async function copy(t,btn){
  const request=(copyRequests.get(btn)||0)+1,active=document.activeElement;
  copyRequests.set(btn,request);
  const label=copyLabels.get(btn)||btn.textContent;
  copyLabels.set(btn,label);
  clearTimeout(copyTimers.get(btn));
  let copied=false;
  if(navigator.clipboard&&typeof navigator.clipboard.writeText==='function'){
    try{await navigator.clipboard.writeText(t);copied=true}catch(e){}
  }
  if(!copied&&copyRequests.get(btn)===request){
    const a=document.createElement('textarea');a.value=t;a.setAttribute('readonly','');a.style.position='fixed';a.style.left='-9999px';document.body.appendChild(a);a.select();
    try{copied=document.execCommand('copy')}catch(e){}
    a.remove();
    if(active&&active.isConnected)active.focus();
  }
  if(copyRequests.get(btn)!==request)return;
  btn.textContent=copied?'Copied':'Copy failed';
  copyTimers.set(btn,setTimeout(()=>{if(copyRequests.get(btn)===request&&btn.isConnected)btn.textContent=label},1200));
}

async function loadFile(f){
  if(!f)return;
  const request=++fileSeq;
  seq++;
  file=null;R={};note='';
  $('dn').textContent=f.name;
  if(f.size>MAX){
    note='That file is over 200 MB. Try a smaller one.';
    $('ds').textContent='Choose a file up to 200 MB.';
    draw();verify();return;
  }
  $('ds').textContent='Reading\u2026';
  draw();verify();
  try{
    const bytes=new Uint8Array(await f.arrayBuffer());
    if(request!==fileSeq||src!=='f')return;
    file={name:f.name,size:f.size,bytes};
    $('ds').textContent=f.size.toLocaleString()+' bytes. Click or drop to replace.';
    run();
  }catch(e){
    if(request!==fileSeq||src!=='f')return;
    file=null;R={};note='Couldn\u2019t read that file.';
    $('ds').textContent='Could not read the file. Choose another file.';
    draw();verify();
  }
}

function setSrc(s){
  if(src!==s)fileSeq++;
  src=s;
  [...$('src').children].forEach(b=>b.setAttribute('aria-pressed',b.dataset.s===s));
  $('txt').hidden=s!=='t';$('drop').hidden=s!=='f';
  $('lIn').textContent=s==='t'?'Text to hash':'File to hash';
  run();
}

$('tabs').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  mode=b.dataset.m;[...$('tabs').children].forEach(x=>x.setAttribute('aria-pressed',x===b));draw();
});
$('src').addEventListener('click',e=>{const b=e.target.closest('button');if(b)setSrc(b.dataset.s)});
$('txt').addEventListener('input',run);
$('fmt').addEventListener('change',()=>{draw()});
$('vf').addEventListener('input',verify);
$('file').addEventListener('change',e=>loadFile(e.target.files[0]));
const dz=$('drop');
['dragenter','dragover'].forEach(t=>dz.addEventListener(t,e=>{e.preventDefault();dz.classList.add('over')}));
['dragleave','drop'].forEach(t=>dz.addEventListener(t,e=>{e.preventDefault();dz.classList.remove('over')}));
dz.addEventListener('drop',e=>loadFile(e.dataTransfer.files[0]));
$('rows').addEventListener('click',e=>{const a=e.target.dataset.c;if(a)copy(fmt(R[a]),e.target)});
$('copyall').onclick=e=>copy(ALGS.filter(a=>R[a.id]).map(a=>a.name+': '+fmt(R[a.id])).join('\n'),e.target);
$('clear').onclick=()=>{
  fileSeq++;$('txt').value='';$('vf').value='';file=null;$('file').value='';
  $('dn').textContent='Drop a file here';$('ds').textContent='or click to choose one (up to 200 MB). The file is not uploaded.';
  run();
};
draw();
</script>
</body>
</html>
