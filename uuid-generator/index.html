<style>
:root{color-scheme:light;--bg:#f5e3c8;--panel:#fcf3e3;--ink:#33200f;--mute:#7c6450;--line:#d9be97;--brick:#a9431f;--saffron:#f0b64a}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden}
.wrap{height:100%;max-width:1100px;margin:0 auto;padding:22px 24px 16px;display:flex;flex-direction:column}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;padding-bottom:10px;border-bottom:3px solid var(--brick);margin-bottom:14px}
h1{font:400 clamp(1.9rem,4vw,2.7rem)/1 Charter,"Bitstream Charter","Iowan Old Style",Georgia,serif;margin:0;letter-spacing:-.02em}
.tag{color:var(--mute);font-size:.85rem;text-align:right;max-width:30ch}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:0;border:1px solid var(--line);background:var(--panel)}
.tabs input{position:absolute;opacity:0;pointer-events:none}
.tabs label{padding:10px 14px 9px;cursor:pointer;border-right:1px solid var(--line);border-bottom:4px solid transparent;display:block}
.tabs label:last-of-type{border-right:0}
.tabs b{display:block;font:400 1.25rem Charter,Georgia,serif}
.tabs span{display:block;font-size:.8rem;color:var(--mute)}
.tabs label:hover{background:#f8e8cc}
.tabs input:checked+label{border-bottom-color:var(--brick);background:#f8e3bd}
.tabs input:focus-visible+label{outline:3px solid var(--brick);outline-offset:-3px}
#desc{margin:8px 0 12px;color:var(--mute);font-size:.9rem;min-height:1.3em}
.band{display:flex;flex-wrap:wrap;gap:12px 26px;align-items:center;padding:10px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-bottom:10px}
.cnt{display:flex;align-items:center;gap:10px}
.cnt input[type=range]{width:200px;accent-color:var(--brick)}
.val{font:600 1.3rem Charter,Georgia,serif;min-width:2.4ch}
.fmt{display:flex;gap:16px}
label.chk{display:flex;gap:7px;align-items:center;cursor:pointer}
input[type=checkbox]{width:16px;height:16px;accent-color:var(--brick)}
.sp{flex:1}
button{font:inherit;cursor:pointer;border:1px solid var(--ink);background:transparent;color:var(--ink);padding:6px 12px;border-radius:2px}
button:hover{background:var(--ink);color:var(--bg)}
button.main{background:var(--brick);border-color:var(--brick);color:#fff8ea;font-weight:600;padding:8px 20px}
button.main:hover{background:var(--ink);border-color:var(--ink)}
button.sm{padding:1px 8px;font-size:.8rem}
:focus-visible{outline:3px solid var(--brick);outline-offset:2px}
#dec{margin:0 0 8px;font-size:.88rem;color:var(--mute)}
#list{flex:1;min-height:0;overflow-y:auto;list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(440px,1fr));align-content:start;column-gap:28px;border-top:1px solid var(--line)}
li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:7px 4px;border-bottom:1px solid var(--line)}
.u{font:1rem ui-monospace,Menlo,Consolas,monospace;letter-spacing:.01em;word-break:break-all}
.u .t{color:var(--brick)}
.u .v{background:var(--saffron);color:var(--ink);padding:0 1px}
li:first-child{grid-column:1/-1;padding:12px 4px}
li:first-child .u{font-size:clamp(1.1rem,2.6vw,1.9rem)}
.foot{margin:8px 0 0;color:var(--mute);font-size:.76rem}
@media(max-width:820px){
  html,body{height:auto}body{overflow:auto}.wrap{height:auto}
  header{flex-direction:column;align-items:flex-start;gap:6px}.tag{text-align:left;max-width:none}
  .tabs{grid-template-columns:1fr 1fr}.tabs label:nth-of-type(2){border-right:0}
  #list{max-height:60vh;grid-template-columns:1fr}.cnt input[type=range]{width:150px}
}
</style>
  <script defer src="Home.js"></script>
</head>
<body>
<div class="wrap">
  <header>
    <h1>UUID generator</h1>
    <div class="tag">Made in your browser with its secure random source. Nothing is sent or stored.</div>
  </header>

  <div class="tabs" role="radiogroup" aria-label="UUID version">
    <input type="radio" name="ver" id="v1" value="1"><label for="v1"><b>Version 1</b><span>Time and node</span></label>
    <input type="radio" name="ver" id="v4" value="4"><label for="v4"><b>Version 4</b><span>Fully random</span></label>
    <input type="radio" name="ver" id="v7" value="7" checked><label for="v7"><b>Version 7</b><span>Time-ordered</span></label>
    <input type="radio" name="ver" id="vi" value="i"><label for="vi"><b>Identity</b><span>Sequential GUID</span></label>
  </div>
  <p id="desc"></p>

  <div class="band">
    <div class="cnt"><span>How many</span><input type="range" id="cnt" min="1" max="100" value="5" aria-label="Number of UUIDs"><span class="val" id="cntv">5</span></div>
    <div class="fmt">
      <label class="chk"><input type="checkbox" id="up"> Uppercase</label>
      <label class="chk"><input type="checkbox" id="hy" checked> Hyphens</label>
      <label class="chk"><input type="checkbox" id="br"> Braces</label>
    </div>
    <span class="sp"></span>
    <button id="copyall" aria-live="polite">Copy all</button>
    <button id="dl">Download .txt</button>
    <button class="main" id="go">Generate</button>
  </div>

  <p id="dec"></p>
  <ul id="list"></ul>
  <p class="foot">Highlighted digits: the version number (yellow) and the embedded timestamp (red). Version 1 uses a random node ID because browsers can't read a network card address.</p>
</div>

<script>
const $=id=>document.getElementById(id);
const rb=n=>crypto.getRandomValues(new Uint8Array(n));

const DESC={
 '1':'Built from the time and a node ID. Sorts roughly by creation time, but reveals when it was made.',
 '4':'Random apart from the version bits. The everyday choice when you just need a unique ID.',
 '7':'Starts with a Unix millisecond timestamp, then random bits. Sorts by creation time, which suits database keys.',
 'i':'Sequential GUID for SQL Server and ASP.NET Identity keys. The timestamp sits in the last 6 bytes, where SQL Server sorts, so inserts stay in order.'
};
const TS={ // hex positions holding a timestamp
 '1':i=>i<12||(i>12&&i<16),
 '4':()=>false,
 '7':i=>i<12,
 'i':i=>i>=20
};

function ms48(b,o,ms){
  b[o]=Math.floor(ms/2**40)&255;b[o+1]=Math.floor(ms/2**32)&255;
  b[o+2]=(ms>>>24)&255;b[o+3]=(ms>>>16)&255;b[o+4]=(ms>>>8)&255;b[o+5]=ms&255;
}

const s7={ms:0,seq:0};
function v7(){
  const b=rb(16),now=Date.now();
  if(now>s7.ms){s7.ms=now;s7.seq=((b[6]<<8)|b[7])&0x7ff}
  else{s7.seq++;if(s7.seq>0xfff){s7.ms++;s7.seq=0}}
  ms48(b,0,s7.ms);
  b[6]=0x70|(s7.seq>>8);b[7]=s7.seq&255;b[8]=(b[8]&0x3f)|0x80;
  return{b,ms:s7.ms};
}

const node=rb(6),cs=rb(2);node[0]|=1; // multicast bit marks a random node
const s1={ms:0,sub:0};
function v1(){
  const now=Date.now();
  if(now>s1.ms){s1.ms=now;s1.sub=0}else{s1.sub++;if(s1.sub>9999){s1.ms++;s1.sub=0}}
  const t=(BigInt(s1.ms)+12219292800000n)*10000n+BigInt(s1.sub);
  const lo=Number(t&0xffffffffn),mid=Number((t>>32n)&0xffffn),hi=Number((t>>48n)&0x0fffn)|0x1000;
  const b=new Uint8Array(16);
  b[0]=(lo>>>24)&255;b[1]=(lo>>>16)&255;b[2]=(lo>>>8)&255;b[3]=lo&255;
  b[4]=mid>>8;b[5]=mid&255;b[6]=hi>>8;b[7]=hi&255;
  b[8]=0x80|(cs[0]&0x3f);b[9]=cs[1];b.set(node,10);
  return{b,ms:s1.ms};
}

function v4(){const b=rb(16);b[6]=(b[6]&0x0f)|0x40;b[8]=(b[8]&0x3f)|0x80;return{b,ms:null}}

let last=0;
function ident(){
  const b=rb(16),now=Date.now();
  last=now>last?now:last+1;
  ms48(b,10,last);
  return{b,ms:last};
}

const GEN={'1':v1,'4':v4,'7':v7,'i':ident};
let items=[],ver='7';

const hex=b=>[...b].map(x=>x.toString(16).padStart(2,'0')).join('');
function fmt(h,markup){
  if($('up').checked)h=h.toUpperCase();
  const hy=$('hy').checked,isT=TS[ver];
  let out='';
  for(let i=0;i<32;i++){
    let c=h[i];
    if(markup&&ver!=='i'&&i===12)c='<span class="v">'+c+'</span>';
    else if(markup&&isT(i))c='<span class="t">'+c+'</span>';
    out+=c;
    if(hy&&(i===7||i===11||i===15||i===19))out+='-';
  }
  return $('br').checked?'{'+out+'}':out;
}

function draw(){
  const ul=$('list');ul.innerHTML='';
  items.forEach((it,i)=>{
    const li=document.createElement('li');
    li.innerHTML='<span class="u">'+fmt(it.h,true)+'</span><button class="sm" data-c="'+i+'" aria-live="polite">Copy</button>';
    ul.appendChild(li);
  });
  const f=items[0];
  $('dec').textContent=f.ms==null?'Random. Nothing about time or origin is encoded.':'First one was created '+new Date(f.ms).toISOString().replace('T',' ').replace('Z',' UTC')+', read straight from its digits.';
}
function run(){
  ver=document.querySelector('input[name=ver]:checked').value;
  $('cntv').textContent=$('cnt').value;
  $('desc').textContent=DESC[ver];
  items=Array.from({length:+$('cnt').value},()=>{const g=GEN[ver]();g.h=hex(g.b);return g});
  draw();
}
const all=()=>items.map(it=>fmt(it.h,false)).join('\n');
const copyRequests=new WeakMap(),copyTimers=new WeakMap(),copyLabels=new WeakMap();
async function copy(t,btn){
  const request=(copyRequests.get(btn)||0)+1,active=document.activeElement;
  copyRequests.set(btn,request);
  const label=copyLabels.get(btn)||btn.textContent;
  copyLabels.set(btn,label);
  clearTimeout(copyTimers.get(btn));
  let copied=false;
  if(navigator.clipboard&&typeof navigator.clipboard.writeText==='function'){
    try{await navigator.clipboard.writeText(t);copied=true}catch(e){}
  }
  if(!copied&&copyRequests.get(btn)===request){
    const a=document.createElement('textarea');a.value=t;a.setAttribute('readonly','');a.style.position='fixed';a.style.left='-9999px';document.body.appendChild(a);a.select();
    try{copied=document.execCommand('copy')}catch(e){}
    a.remove();
    if(active&&active.isConnected)active.focus();
  }
  if(copyRequests.get(btn)!==request)return;
  btn.textContent=copied?'Copied':'Copy failed';
  copyTimers.set(btn,setTimeout(()=>{if(copyRequests.get(btn)===request&&btn.isConnected)btn.textContent=label},1200));
}
$('list').addEventListener('click',e=>{const c=e.target.dataset.c;if(c!==undefined)copy(fmt(items[c].h,false),e.target)});
$('copyall').onclick=e=>copy(all(),e.target);
$('dl').onclick=()=>{
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([all()+'\n'],{type:'text/plain'}));
  a.download='uuids-v'+ver+'.txt';a.click();URL.revokeObjectURL(a.href);
};
$('go').onclick=run;
document.querySelectorAll('input[name=ver]').forEach(r=>r.addEventListener('change',run));
$('cnt').addEventListener('input',run);
['up','hy','br'].forEach(id=>$(id).addEventListener('change',draw));
run();
</script>
</body>
</html>
